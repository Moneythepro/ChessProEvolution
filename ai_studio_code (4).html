<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Online Chess Mobile</title>
    <!-- Chess logic library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #eee;
            --board-light: #eeeed2;
            --board-dark: #769656;
            --highlight: rgba(255, 255, 0, 0.5);
            --selected: rgba(100, 200, 100, 0.6);
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; /* Prevent scroll on mobile */
        }

        /* Menu UI */
        #menu, #game-controls {
            width: 90%;
            max-width: 400px;
            text-align: center;
            margin-bottom: 15px;
        }

        input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #333;
            color: white;
            width: 60%;
            margin-bottom: 10px;
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: #769656;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            touch-action: manipulation;
            margin: 5px;
        }

        button:active { transform: scale(0.98); }
        .secondary { background: #555; }

        /* Status Bar */
        #status {
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: bold;
            height: 30px;
        }

        /* Chess Board */
        #board-container {
            width: 95vw;
            max-width: 500px;
            aspect-ratio: 1/1; /* Keeps it square */
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 5px solid #333;
            user-select: none;
            -webkit-user-select: none;
        }

        .square {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .white-square { background-color: var(--board-light); }
        .black-square { background-color: var(--board-dark); }

        .highlight { background-color: var(--highlight) !important; }
        .selected { background-color: var(--selected) !important; }

        /* Pieces */
        .piece {
            width: 90%;
            height: 90%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 2;
            cursor: pointer;
        }

        /* Rotation for Black player */
        .flipped-board { transform: rotate(180deg); }
        .flipped-piece { transform: rotate(180deg); }

        /* Copy ID Popup */
        #room-id-display {
            font-family: monospace;
            background: #333;
            padding: 5px;
            border-radius: 4px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Start Menu -->
    <div id="menu">
        <h1>♞ Mobile Chess</h1>
        <button onclick="createGame()">Create New Game</button>
        <br><br>
        <p>OR</p>
        <input type="text" id="joinInput" placeholder="Enter Game ID">
        <button class="secondary" onclick="joinGame()">Join Game</button>
    </div>

    <!-- Game UI (Hidden initially) -->
    <div id="game-ui" style="display:none; flex-direction: column; align-items: center;">
        <div id="room-id-display" onclick="copyRoomId()">Game ID: <span id="game-id-text"></span> (Tap to Copy)</div>
        <div id="status">Waiting for opponent...</div>
        
        <div id="board-container">
            <!-- Squares generated by JS -->
        </div>

        <div id="game-controls">
            <button class="secondary" onclick="resetBoard()">Resign / Main Menu</button>
        </div>
    </div>

    <script>
        // 1. CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyALVuzOvet0v-RwmkfV2wcw4yfBXmX7hAI",
            authDomain: "vale-148c5.firebaseapp.com",
            projectId: "vale-148c5",
            storageBucket: "vale-148c5.firebasestorage.app",
            messagingSenderId: "45465621562",
            appId: "1:45465621562:web:d3291199a3368765e81103"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. STATE VARIABLES
        let game = new Chess();
        let boardEl = document.getElementById('board-container');
        let selectedSquare = null;
        let playerColor = 'w'; // 'w' or 'b'
        let currentGameId = null;
        let isOnline = false;

        // 3. UI FUNCTIONS
        function initBoardUI() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let square = document.createElement('div');
                    let isLight = (r + c) % 2 === 0;
                    
                    // Standard algebraic notation (a8 to h1)
                    // Row 0 is Rank 8, Row 7 is Rank 1
                    // Col 0 is File a, Col 7 is File h
                    let file = String.fromCharCode(97 + c);
                    let rank = 8 - r;
                    let squareId = file + rank;

                    square.className = `square ${isLight ? 'white-square' : 'black-square'}`;
                    square.id = squareId;
                    square.onclick = () => onSquareClick(squareId);
                    
                    boardEl.appendChild(square);
                }
            }
        }

        function drawPieces() {
            // Clear all pieces first
            document.querySelectorAll('.piece').forEach(el => el.remove());
            document.querySelectorAll('.square').forEach(el => {
                el.classList.remove('highlight');
                el.classList.remove('selected');
            });

            const boardState = game.board();

            // Iterate rows
            for (let r = 0; r < 8; r++) {
                // Iterate cols
                for (let c = 0; c < 8; c++) {
                    let piece = boardState[r][c];
                    if (piece) {
                        let file = String.fromCharCode(97 + c);
                        let rank = 8 - r;
                        let squareId = file + rank;
                        let squareEl = document.getElementById(squareId);

                        let pieceImg = document.createElement('div');
                        pieceImg.className = 'piece';
                        
                        // Mapping to your folder structure: bb, wk, etc.
                        let imgName = piece.color + piece.type + '.png'; 
                        pieceImg.style.backgroundImage = `url('main/pieces/${imgName}')`;
                        
                        // Flip piece if playing black so they aren't upside down
                        if (playerColor === 'b') {
                            pieceImg.classList.add('flipped-piece');
                        }

                        squareEl.appendChild(pieceImg);
                    }
                }
            }

            updateStatus();
            highlightLastMove();
        }

        function highlightLastMove() {
            const history = game.history({ verbose: true });
            if (history.length > 0) {
                const lastMove = history[history.length - 1];
                document.getElementById(lastMove.from)?.classList.add('highlight');
                document.getElementById(lastMove.to)?.classList.add('highlight');
            }
        }

        function updateStatus() {
            let statusText = '';
            let moveColor = game.turn() === 'w' ? 'White' : 'Black';

            if (game.in_checkmate()) {
                statusText = `Game over, ${moveColor} is in checkmate.`;
            } else if (game.in_draw()) {
                statusText = 'Game over, drawn position';
            } else {
                statusText = `${moveColor}'s turn`;
                if (game.in_check()) {
                    statusText += ', ' + moveColor + ' is in check';
                }
            }
            document.getElementById('status').innerText = statusText;
        }

        // 4. GAME INTERACTION (Tap to Move)
        function onSquareClick(squareId) {
            // Check if it's our turn
            if (isOnline && game.turn() !== playerColor) return;
            if (game.game_over()) return;

            const squareEl = document.getElementById(squareId);

            // If we have a selected square, try to move
            if (selectedSquare) {
                // Deselect if clicking same square
                if (selectedSquare === squareId) {
                    selectedSquare = null;
                    drawPieces(); // Redraw removes highlights
                    return;
                }

                // Attempt move
                const move = game.move({
                    from: selectedSquare,
                    to: squareId,
                    promotion: 'q' // Always promote to queen for simplicity on mobile
                });

                if (move) {
                    // Move valid
                    selectedSquare = null;
                    drawPieces();
                    if (isOnline) sendMoveToFirebase(move);
                } else {
                    // Invalid move, check if clicking on another own piece
                    const piece = game.get(squareId);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = squareId;
                        drawPieces(); // clear old selection
                        document.getElementById(squareId).classList.add('selected');
                        highlightLegalMoves(squareId);
                    } else {
                        selectedSquare = null;
                        drawPieces();
                    }
                }
            } else {
                // First click: Select piece
                const piece = game.get(squareId);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = squareId;
                    document.getElementById(squareId).classList.add('selected');
                    highlightLegalMoves(squareId);
                }
            }
        }

        function highlightLegalMoves(square) {
            const moves = game.moves({ square: square, verbose: true });
            moves.forEach(move => {
                // Simple dot indicator or highlight
                let el = document.getElementById(move.to);
                let hint = document.createElement('div');
                hint.style.cssText = "width: 20%; height: 20%; background: rgba(0,0,0,0.2); border-radius: 50%; position: absolute; z-index: 1;";
                el.appendChild(hint);
            });
        }

        // 5. FIREBASE LOGIC
        function createGame() {
            const newGameId = Math.random().toString(36).substring(2, 8).toUpperCase();
            currentGameId = newGameId;
            playerColor = 'w';
            isOnline = true;

            // Set Initial Data
            db.ref('games/' + newGameId).set({
                fen: game.fen(),
                turn: 'w',
                whiteJoined: true,
                blackJoined: false
            });

            startGameUI();
            listenToGame();
            document.getElementById('status').innerText = "Waiting for Black to join...";
        }

        function joinGame() {
            const inputId = document.getElementById('joinInput').value.trim().toUpperCase();
            if (!inputId) return alert("Please enter a Game ID");

            db.ref('games/' + inputId).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    currentGameId = inputId;
                    playerColor = 'b'; // Joiner is Black
                    isOnline = true;
                    
                    // Update DB that black joined
                    db.ref('games/' + inputId).update({ blackJoined: true });

                    startGameUI();
                    flipBoard(); // Black sees board flipped
                    listenToGame();
                } else {
                    alert("Game ID not found!");
                }
            });
        }

        function listenToGame() {
            db.ref('games/' + currentGameId).on('value', snapshot => {
                const data = snapshot.val();
                if (!data) return;

                // Sync Board State
                if (data.fen !== game.fen()) {
                    game.load(data.fen);
                    drawPieces();
                }

                // Check connection status
                if (playerColor === 'w' && data.blackJoined) {
                    // Update status if it was waiting
                    if(document.getElementById('status').innerText.includes("Waiting")) {
                        updateStatus();
                    }
                }
            });
        }

        function sendMoveToFirebase(move) {
            db.ref('games/' + currentGameId).update({
                fen: game.fen(),
                turn: game.turn(),
                lastMove: move
            });
        }

        // 6. HELPER FUNCTIONS
        function startGameUI() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            document.getElementById('game-id-text').innerText = currentGameId;
            document.getElementById('room-id-display').style.display = 'block';
            
            initBoardUI();
            drawPieces();
        }

        function resetBoard() {
            if(confirm("Are you sure you want to leave?")) {
                location.reload();
            }
        }

        function flipBoard() {
            boardEl.classList.add('flipped-board');
            // Pieces are re-rendered by drawPieces and will get flipped-piece class
            drawPieces();
        }

        function copyRoomId() {
            navigator.clipboard.writeText(currentGameId).then(() => {
                alert("Game ID copied to clipboard!");
            });
        }

        // Initialize empty board visuals for fun behind menu
        initBoardUI();
    </script>
</body>
</html>
