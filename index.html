<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ChessProEvolution</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="app">
    <!-- Centered Header -->
    <header class="centered-header">
      <h1>𝐂𝐡𝐞𝐬𝐬 𝐏𝐫𝐨 𝐄𝐯𝐨𝐥𝐮𝐭𝐢𝐨𝐧</h1>
    </header>

    <!-- Floating 3-dot Menu Button -->
    <button id="menuBtn" class="menu-button" title="Menu">
      <i data-lucide="more-horizontal"></i>
    </button>

    <!-- Start Menu -->
    <div id="startMenu">
      <h2>Select Game Mode</h2>
      <label>
        Mode:
        <select id="modeSelect" disabled>
          <option value="pvp" selected>Player vs Player</option>
        </select>
      </label>

      <label>
        Timer:
        <select id="timerSelect">
          <option value="0">No Timer</option>
          <option value="10" selected>10 Minutes</option>
          <option value="20">20 Minutes</option>
          <option value="30">30 Minutes</option>
        </select>
      </label>

      <label>
        <input type="checkbox" id="speechToggle" />
        Enable Move Speech
      </label>

      <label>
        Voice:
        <select id="voiceSelect"></select>
      </label>

      <label>
        Language:
        <select id="langSelect">
          <option value="en-US" selected>English (US)</option>
          <option value="en-GB">English (UK)</option>
          <option value="hi-IN">Hindi</option>
          <option value="fr-FR">French</option>
          <option value="es-ES">Spanish</option>
          <option value="de-DE">German</option>
          <option value="ja-JP">Japanese</option>
        </select>
      </label>

      <button id="startGameBtn"><i data-lucide="play"></i> Start Game</button>
    </div>

    <!-- Game Area -->
    <div id="boardWrapper" style="display: none;">
      <div id="status" class="status-floating">Ready</div>
      <div id="board"></div>

      <div id="info">
        <div id="timers">
          <div class="timer white">White: <span id="whiteTimer">10:00</span></div>
          <div class="timer black">Black: <span id="blackTimer">10:00</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Menu Modal (3-dot) -->
  <div id="menuModal" class="menu-modal">
    <label>
      <input type="checkbox" id="speechToggleMenu" />
      <i data-lucide="mic"></i> Speech
    </label>
    <label>
      <input type="checkbox" id="themeToggleMenu" />
      <i data-lucide="moon-star"></i> Theme
    </label>
  </div>

  <!-- Winner Modal -->
  <div id="winnerModal" class="modal">
    <h2 id="winnerText">Checkmate!</h2>
    <button onclick="newGame()"><i data-lucide="rotate-ccw"></i> Play Again</button>
  </div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="app.js"></script>

  <!-- Icons & Sync -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const speechMain = document.getElementById("speechToggle");
      const speechMenu = document.getElementById("speechToggleMenu");
      const themeMenu = document.getElementById("themeToggleMenu");

      if (speechMain && speechMenu) {
        speechMain.addEventListener("change", () => {
          speechMenu.checked = speechMain.checked;
        });
        speechMenu.addEventListener("change", () => {
          speechMain.checked = speechMenu.checked;
        });
      }

      themeMenu.checked = document.body.classList.contains("dark");
      themeMenu.addEventListener("change", () => {
        document.body.classList.toggle("dark", themeMenu.checked);
      });
    });
  </script>
</body>
</html>
