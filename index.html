<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>Chess Pro Evolution</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="shell">

    <!-- Header -->
    <header class="app-header">
      <h1>Chess Pro Evolution</h1>
      <button id="menuBtn" class="icon-btn" title="Menu">
        <i data-lucide="more-horizontal"></i>
      </button>
    </header>

    <!-- Start Menu -->
    <section id="startMenu" class="card">
      <h2>Start a Game</h2>

      <label class="field">
        <span>Mode</span>
        <select id="modeSelect">
          <option value="pvp" selected>Classic PvP</option>
          <option value="illegal">🚨 Illegal PvP</option>
          <option value="illegal-ultra">🕶️ Illigal Chess Ultra (no hints)</option>
        </select>
      </label>

      <label class="field">
        <span>Timer</span>
        <select id="timerSelect">
          <option value="10" selected>10 Minutes</option>
          <option value="20">20 Minutes</option>
          <option value="30">30 Minutes</option>
        </select>
      </label>

      <label class="field">
        <span>Voice</span>
        <select id="langSelect">
          <option value="none" selected>🚫 No Voice</option>
          <option value="en-US">🇺🇸 English (US)</option>
          <option value="en-GB">🇬🇧 English (UK)</option>
          <option value="hi-IN">🇮🇳 Hindi</option>
          <option value="fr">🇫🇷 French</option>
          <option value="es">🇪🇸 Spanish</option>
          <option value="de">🇩🇪 German</option>
          <option value="ja">🇯🇵 Japanese</option>
        </select>
      </label>

      <!-- Hidden, auto-filled voice list -->
      <select id="voiceSelect" style="display:none"></select>

      <button id="startGameBtn" class="primary">
        <i data-lucide="play"></i><span>Start Game</span>
      </button>
    </section>

    <!-- Game Area -->
    <section id="boardWrapper" class="board-wrapper" style="display:none;">
      <div id="status" class="status-pill">White to move</div>

      <div class="board-frame">
        <div id="board" class="board"></div>
      </div>

      <div id="timers" class="timers">
        <div class="timer white">White: <span id="whiteTimer">10:00</span></div>
        <div class="timer black">Black: <span id="blackTimer">10:00</span></div>
      </div>

      <div id="capturedContainer" class="captured">
        <div>
          <span class="captured-label">White captured</span>
          <div id="whiteCaptured" class="captured-row"></div>
        </div>
        <div>
          <span class="captured-label">Black captured</span>
          <div id="blackCaptured" class="captured-row"></div>
        </div>
      </div>
    </section>

    <!-- Menu (3-dot) -->
    <div id="menuModal" class="menu-modal">
      <button id="themeToggleMenu" class="menu-item">
        <i data-lucide="moon-star"></i><span>Toggle Theme</span>
      </button>
      <button id="quitGameBtn" class="menu-item danger">
        <i data-lucide="log-out"></i><span>Quit Game</span>
      </button>
    </div>

    <!-- Winner Modal -->
    <div id="winnerModal" class="modal">
      <div class="modal-card">
        <div class="modal-icon"><i data-lucide="trophy"></i></div>
        <h3 id="winnerText">Checkmate!</h3>
        <div class="modal-actions">
          <button id="playAgainBtn" class="primary ghost">
            <i data-lucide="rotate-ccw"></i><span>Play Again</span>
          </button>
          <button id="mainMenuBtn" class="primary">
            <i data-lucide="home"></i><span>Main Menu</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Promotion Modal -->
    <div id="promotionModal" class="sheet">
      <div class="sheet-card">
        <h4>Choose promotion</h4>
        <div class="promotion-options">
          <button data-piece="q"><img alt="Queen" /></button>
          <button data-piece="r"><img alt="Rook" /></button>
          <button data-piece="b"><img alt="Bishop" /></button>
          <button data-piece="n"><img alt="Knight" /></button>
        </div>
      </div>
    </div>

  </div>

  <!-- Libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="chessillegal.js"></script>
  <script src="app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
