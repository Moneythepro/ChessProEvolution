<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>ChessProEvolution</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header>
      <h1></i> ChessProEvolution</h1>
      <div class="top-controls">
        <button id="menuBtn" title="Menu"><i data-lucide="more-horizontal"></i></button>
        <button onclick="toggleTheme()" title="Toggle Theme"><i data-lucide="moon-star"></i></button>
      </div>
    </header>

    <!-- Start Menu -->
    <div id="startMenu">
      <h2>Select Game Mode</h2>
      <label>
        Mode:
        <select id="modeSelect" disabled>
          <option value="pvp" selected>Player vs Player</option>
        </select>
      </label>

      <label>
        Timer:
        <select id="timerSelect">
          <option value="0">No Timer</option>
          <option value="10" selected>10 Minutes</option>
          <option value="20">20 Minutes</option>
          <option value="30">30 Minutes</option>
        </select>
      </label>

      <label>
        <input type="checkbox" id="speechToggle" />
        Enable Move Speech
      </label>

      <button id="startGameBtn"><i data-lucide="play"></i> Start Game</button>
    </div>

    <!-- Game Area -->
    <div id="boardWrapper" style="display: none;">
      <div id="board"></div>

      <!-- Timers and Info -->
      <div id="info">
        <div id="timers">
          <div class="timer white"><i data-lucide="clock"></i> White: <span id="whiteTimer">10:00</span></div>
          <div class="timer black"><i data-lucide="clock"></i> Black: <span id="blackTimer">10:00</span></div>
        </div>
        <p>Status: <span id="status">Ready</span></p>
      </div>
    </div>
  </div>

  <!-- Move History Modal -->
  <div id="moveHistoryModal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2>Move History</h2>
      <ol id="moveList"></ol>
      <button id="closeHistoryModal"><i data-lucide="x"></i> Close</button>
    </div>
  </div>

  <!-- 3-dot Compact Menu Modal -->
  <div id="menuModal" class="menu-modal" style="display: none;">
    <button id="exportBtn"><i data-lucide="download"></i> Export PGN</button>
    <button id="importBtn"><i data-lucide="upload"></i> Import PGN</button>
    <button id="toggleHistoryBtn"><i data-lucide="scroll"></i> Toggle History</button>
    <label>
      <input type="checkbox" id="speechToggleMenu" />
      <i data-lucide="mic"></i> Move Speech
    </label>
  </div>

  <!-- Winner Modal -->
  <div id="winnerModal" style="display: none;">
    <h2 id="winnerText">Checkmate!</h2>
    <button onclick="newGame()"><i data-lucide="rotate-ccw"></i> Play Again</button>
  </div>

  <!-- Chess Engine & Game -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="app.js"></script>

  <!-- Lucide Icons -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const toggle = document.getElementById("speechToggle");
      const syncToggle = document.getElementById("speechToggleMenu");
      if (toggle && syncToggle) {
        toggle.addEventListener("change", () => {
          syncToggle.checked = toggle.checked;
        });
        syncToggle.addEventListener("change", () => {
          toggle.checked = syncToggle.checked;
        });
      }
    });

    function toggleTheme() {
      document.body.classList.toggle("dark");
    }
  </script>
</body>
</html>
